kind = "web"
previewPath = "/"
title = "Prime Haven"
version = "1.0.0"
id = "artifacts/prime-haven"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21106

[services.development]
run = "pnpm --filter @workspace/prime-haven run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prime-haven", "run", "build" ]
publicDir = "dist"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21106"
BASE_PATH = "/"
